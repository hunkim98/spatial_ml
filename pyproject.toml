[project]
name = "spatial-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "tqdm>=4.67.3",
    "wandb>=0.26.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

