[project]
name = "zoning_codes_extract"
version = "0.2.0"
requires-python = ">=3.12"

dependencies = [
    "python-docx>=1.1.0", # DOCX parsing for municode files
    "rapidfuzz>=3.5.0", # Fuzzy matching for validation
    "transformers>=4.30.0", # BERT/RoBERTa models
    "torch>=2.0.0", # PyTorch backend
    "datasets>=2.14.0", # HuggingFace datasets
    "scikit-learn>=1.3.0", # Metrics and evaluation
    "seqeval>=1.2.2", # NER evaluation metrics
    "pandas>=2.0.0", # Data manipulation
    "numpy>=1.24.0", # Numerical operations
    "accelerate>=1.12.0",
    "wandb>=0.15.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
